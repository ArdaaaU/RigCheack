<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Destek — RigCheck</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ---- THREAD LIST VIEW ---- */
    .thread-list-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .12s;
      -webkit-tap-highlight-color: transparent;
    }
    .thread-list-item:active { background: var(--surface); }
    .thread-list-item.active { background: var(--surface); border-left: 3px solid var(--blue); }
    .thread-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      font-weight: 700;
      color: var(--text-2);
    }
    .thread-item-body { flex: 1; min-width: 0; }
    .thread-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .thread-item-author { font-size: 14px; font-weight: 700; color: var(--text); }
    .thread-item-time { font-size: 11px; color: var(--text-4); flex-shrink: 0; }
    .thread-item-title {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .thread-item-footer { display: flex; align-items: center; gap: 8px; margin-top: 6px; }

    /* ---- CHAT VIEW ---- */
    .chat-view {
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--top-bar-h) - var(--bottom-nav-h) - 46px); /* 46 = view switcher */
    }
    .chat-thread-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-2);
    }
    .chat-thread-title { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .chat-thread-hw { font-size: 12px; color: var(--text-3); margin-top: 4px; }
    .chat-thread-actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .msg {
      display: flex;
      flex-direction: column;
      max-width: 84%;
      gap: 4px;
    }
    .msg.user { align-self: flex-start; }
    .msg.expert { align-self: flex-end; }
    .msg-author {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-4);
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 4px;
    }
    .msg.expert .msg-author { justify-content: flex-end; }
    .msg-bubble {
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
    }
    .msg.user .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
    }
    .msg.expert .msg-bubble {
      background: var(--blue);
      border-radius: 16px 4px 16px 16px;
      color: #fff;
    }
    .msg-time { font-size: 11px; color: var(--text-4); padding: 0 4px; }
    .msg.expert .msg-time { text-align: right; }

    /* ---- INPUT BAR ---- */
    .chat-input-bar {
      padding: 10px 16px;
      background: var(--bg-2);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-name-input {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
    }
    .chat-name-input:focus { outline: none; border-color: var(--blue); }
    .expert-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      cursor: pointer;
      white-space: nowrap;
    }
    .expert-label input { cursor: pointer; accent-color: var(--blue); }
    .chat-send-row { display: flex; gap: 8px; align-items: flex-end; }
    #chat-msg {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-lg);
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      resize: none;
      line-height: 1.5;
      max-height: 100px;
    }
    #chat-msg:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
    #chat-msg::placeholder { color: var(--text-4); }
    .send-btn {
      width: 44px; height: 44px;
      background: var(--blue);
      border: none;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 16px var(--blue-glow);
      transition: all .15s;
    }
    .send-btn:hover { background: var(--blue-dark); }
    .send-btn:active { transform: scale(.9); }

    /* ---- EMPTY CHAT ---- */
    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      gap: 12px;
    }
    .chat-empty-icon { font-size: 56px; opacity: .6; }
    .chat-empty h2 { font-size: 20px; font-weight: 700; }
    .chat-empty p { font-size: 14px; color: var(--text-3); line-height: 1.5; }

    /* ---- VIEW SWITCHER ---- */
    .support-tabs {
      display: flex;
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
    }
    .support-tab {
      flex: 1;
      padding: 12px 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-3);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all .15s;
      background: none;
      border-left: none; border-right: none; border-top: none;
      font-family: inherit;
    }
    .support-tab.active { color: var(--blue); border-bottom-color: var(--blue); }

    /* ---- FILTER ROW ---- */
    .filter-row {
      display: flex;
      gap: 8px;
      padding: 10px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
<div id="app-shell">
  <header class="top-bar">
    <a href="/" class="top-bar-logo">
      <div class="top-bar-icon">⚡</div>
      <span class="top-bar-title">Rig<span>Check</span></span>
    </a>
    <div class="top-bar-actions">
      <button class="btn btn-primary btn-sm" id="new-thread-btn">+ Yeni</button>
    </div>
  </header>

  <!-- Tab switch: Threads / Chat -->
  <div class="support-tabs">
    <button class="support-tab active" data-tab="threads">💬 Konular</button>
    <button class="support-tab" data-tab="chat" id="chat-tab">📩 Sohbet</button>
  </div>

  <main class="screen">
    <!-- THREADS VIEW -->
    <div id="view-threads">
      <!-- filter chips -->
      <div class="filter-row">
        <button class="pill-tab active" data-status="all">Tümü</button>
        <button class="pill-tab" data-status="open">● Açık</button>
        <button class="pill-tab" data-status="resolved">✓ Çözüldü</button>
      </div>
      <!-- search -->
      <div style="padding:10px 20px;border-bottom:1px solid var(--border)">
        <div class="picker-search-inner" style="background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-xl);padding:9px 14px;display:flex;align-items:center;gap:10px">
          <span style="font-size:15px;color:var(--text-3)">🔍</span>
          <input type="text" id="thread-search" placeholder="Konu ara..." style="flex:1;background:none;border:none;color:var(--text);font-size:14px;font-family:inherit;outline:none" />
        </div>
      </div>
      <div id="thread-list">
        <div class="loading-center"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- CHAT VIEW -->
    <div id="view-chat" style="display:none">
      <div class="chat-empty" id="chat-placeholder">
        <div class="chat-empty-icon">💬</div>
        <h2>Konu Seç</h2>
        <p>Sol taraftan bir destek konusu seç veya yeni bir konu aç.</p>
        <button class="btn btn-primary" id="new-thread-btn2">+ Yeni Konu</button>
      </div>
      <div id="chat-content" style="display:none;flex-direction:column;height:100%">
        <div class="chat-thread-header" id="chat-thread-header"></div>
        <div class="messages-area" id="messages-area"></div>
        <div class="chat-input-bar">
          <div class="chat-meta-row">
            <input class="chat-name-input" id="chat-author" type="text" value="Anonim" placeholder="Adın..." />
            <label class="expert-label"><input type="checkbox" id="is-expert" /> Uzman</label>
          </div>
          <div class="chat-send-row">
            <textarea id="chat-msg" rows="1" placeholder="Mesajını yaz... (Ctrl+Enter ile gönder)"></textarea>
            <button class="send-btn" id="send-btn">➤</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="/" class="nav-item">
      <span class="nav-item-icon">🏠</span>
      <span class="nav-item-label">Ana Sayfa</span>
      <span class="nav-dot"></span>
    </a>
    <a href="/builder.html" class="nav-item">
      <span class="nav-item-icon">🔧</span>
      <span class="nav-item-label">Builder</span>
      <span class="nav-dot"></span>
    </a>
    <a href="/support.html" class="nav-item active">
      <span class="nav-item-icon">💬</span>
      <span class="nav-item-label">Destek</span>
      <span class="nav-dot"></span>
    </a>
    <a href="/benchmarks.html" class="nav-item">
      <span class="nav-item-icon">📊</span>
      <span class="nav-item-label">Bench</span>
      <span class="nav-dot"></span>
    </a>
    <a href="/errors.html" class="nav-item">
      <span class="nav-item-icon">🔴</span>
      <span class="nav-item-label">Hatalar</span>
      <span class="nav-dot"></span>
    </a>
  </nav>
</div>

<!-- New Thread Bottom Sheet -->
<div class="modal-overlay" id="new-thread-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2>Yeni Destek Konusu</h2>
      <button class="modal-close" id="close-modal">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Soru / Başlık *</label>
        <input class="form-input" id="thread-title" type="text" placeholder="RTX 4070 1440p 144Hz için yeterli mi?" />
      </div>
      <div class="form-group">
        <label class="form-label">Mevcut Donanımın</label>
        <textarea class="form-textarea" id="thread-hardware" placeholder="CPU: i7-13700K&#10;GPU: RTX 3070&#10;RAM: 16GB DDR4..." rows="3"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Adın</label>
        <input class="form-input" id="thread-author" type="text" value="Anonim" />
      </div>
      <div id="thread-error" class="error-banner" style="display:none"></div>
      <button class="btn btn-primary btn-full" id="create-thread-btn">Konu Oluştur</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script type="module" src="./js/support.js"></script>
</body>
</html>
