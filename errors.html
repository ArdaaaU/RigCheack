<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Hata Kodları — RigCheck</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ---- SEARCH ---- */
    .error-search-wrap {
      padding: 14px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .error-search-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-xl);
      padding: 12px 16px;
      transition: border-color .15s;
    }
    .error-search-inner:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
    .error-search-inner input {
      flex: 1;
      background: none;
      border: none;
      color: var(--text);
      font-size: 15px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
    }
    .error-search-inner input::placeholder { color: var(--text-4); font-size: 14px; font-family: inherit; }
    .error-search-icon { font-size: 18px; color: var(--text-3); flex-shrink: 0; }
    .search-clear {
      background: var(--surface-2);
      border: none;
      color: var(--text-3);
      width: 24px; height: 24px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s;
    }
    .search-clear:hover { background: var(--surface-2); color: var(--text); }

    /* ---- CATEGORY CHIPS ---- */
    .cat-strip {
      display: flex;
      gap: 8px;
      padding: 10px 20px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
    }
    .cat-strip::-webkit-scrollbar { display: none; }
    .cat-chip {
      padding: 7px 16px;
      border-radius: 99px;
      border: 1.5px solid var(--border);
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-3);
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      flex-shrink: 0;
      transition: all .15s;
    }
    .cat-chip:hover { border-color: var(--border-2); color: var(--text-2); }
    .cat-chip.active-all    { background: var(--blue); border-color: var(--blue); color: #fff; }
    .cat-chip.active-bsod   { background: var(--red);    border-color: var(--red);    color: #fff; }
    .cat-chip.active-post   { background: var(--amber);  border-color: var(--amber);  color: #000; }
    .cat-chip.active-beep   { background: var(--purple); border-color: var(--purple); color: #fff; }

    /* ---- ERROR CARDS ---- */
    .error-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      margin: 0 20px 12px;
      overflow: hidden;
      transition: border-color .15s;
    }
    .error-card:hover { border-color: var(--border-2); }
    .error-card-header {
      padding: 16px 18px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .error-cat-icon {
      width: 44px; height: 44px;
      border-radius: var(--r);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .cat-icon-bsod   { background: var(--red-soft); }
    .cat-icon-post   { background: var(--amber-soft); }
    .cat-icon-beep   { background: var(--purple-soft); }
    .cat-icon-other  { background: var(--surface-2); }
    .error-card-main { flex: 1; min-width: 0; }
    .error-code-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--red);
      margin-bottom: 3px;
      letter-spacing: .3px;
    }
    .error-card-title { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 4px; }
    .error-card-preview { font-size: 13px; color: var(--text-3); line-height: 1.4; }
    .error-chevron {
      font-size: 18px;
      color: var(--text-4);
      transition: transform .25s cubic-bezier(.32,1,.23,1);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .error-card.open .error-chevron { transform: rotate(180deg); }
    .error-card.open { border-color: var(--blue); }

    /* ---- EXPANDED BODY ---- */
    .error-card-body {
      display: none;
      padding: 0 18px 18px;
    }
    .error-card.open .error-card-body { display: block; }
    .error-section { margin-top: 14px; }
    .error-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--text-4);
      margin-bottom: 8px;
    }
    .cause-list, .solution-list { display: flex; flex-direction: column; gap: 6px; }
    .cause-item {
      display: flex;
      gap: 8px;
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.5;
      align-items: flex-start;
    }
    .cause-item::before { content: '▸'; color: var(--red); flex-shrink: 0; margin-top: 1px; font-size: 11px; }
    .solution-item {
      display: flex;
      gap: 10px;
      background: var(--green-soft);
      border: 1px solid rgba(34,197,94,.15);
      border-radius: var(--r);
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.5;
      align-items: flex-start;
    }
    .sol-num {
      width: 22px; height: 22px;
      background: var(--green);
      color: #fff;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .error-desc-full {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.7;
      padding: 0;
    }
    .card-divider { height: 1px; background: var(--border); margin: 12px 0; }
    .expert-cta {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--blue-soft);
      border: 1px solid rgba(59,130,246,.2);
      border-radius: var(--r);
      padding: 12px 14px;
      margin-top: 12px;
      text-decoration: none;
    }
    .expert-cta-text { font-size: 13px; color: var(--text-2); font-weight: 500; }
    .expert-cta-link { font-size: 13px; color: var(--blue); font-weight: 700; margin-left: auto; white-space: nowrap; }
  </style>
</head>
<body>
<div id="app-shell">
  <header class="top-bar">
    <a href="/" class="top-bar-logo">
      <div class="top-bar-icon">⚡</div>
      <span class="top-bar-title">Rig<span>Check</span></span>
    </a>
    <div class="top-bar-actions">
      <span style="font-size:13px;font-weight:600;color:var(--text-3)" id="result-badge">—</span>
    </div>
  </header>

  <!-- Search -->
  <div class="error-search-wrap">
    <div class="error-search-inner">
      <span class="error-search-icon">🔍</span>
      <input type="text" id="error-search" placeholder="0x0000001A, MEMORY_MANAGEMENT, A2..." />
      <button class="search-clear" id="search-clear" style="display:none">✕</button>
    </div>
  </div>

  <!-- Category chips -->
  <div class="cat-strip">
    <button class="cat-chip active-all" data-cat="">Tümü</button>
    <button class="cat-chip" data-cat="bsod">🔵 BSOD</button>
    <button class="cat-chip" data-cat="post">🟡 POST LED</button>
    <button class="cat-chip" data-cat="beep">🔊 Bip Sesi</button>
  </div>

  <main class="screen">
    <div style="padding:10px 20px 6px;font-size:13px;color:var(--text-3)" id="results-label">Tümü gösteriliyor</div>
    <div id="error-list">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="/" class="nav-item">
      <span class="nav-item-icon">🏠</span>
      <span class="nav-item-label">Ana Sayfa</span>
      <span class="nav-dot"></span>
    </a>
    <a href="/builder.html" class="nav-item">
      <span class="nav-item-icon">🔧</span>
      <span class="nav-item-label">Builder</span>
      <span class="nav-dot"></span>
    </a>
    <a href="/support.html" class="nav-item">
      <span class="nav-item-icon">💬</span>
      <span class="nav-item-label">Destek</span>
      <span class="nav-dot"></span>
    </a>
    <a href="/benchmarks.html" class="nav-item">
      <span class="nav-item-icon">📊</span>
      <span class="nav-item-label">Bench</span>
      <span class="nav-dot"></span>
    </a>
    <a href="/errors.html" class="nav-item active">
      <span class="nav-item-icon">🔴</span>
      <span class="nav-item-label">Hatalar</span>
      <span class="nav-dot"></span>
    </a>
  </nav>
</div>

<div class="toast-container" id="toast-container"></div>
<script type="module" src="./js/errors.js"></script>
</body>
</html>
